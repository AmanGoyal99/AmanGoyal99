<style>
/* Layout: full-screen canvas office (camera follows the founder), slim HUD pinned top, hint pinned bottom. */
:root {
  --night: #12082a;
  --ink: #f6f1ff;
  --ink-dim: rgba(246,241,255,.62);
  --pink: #fa57e5;
  --violet: #8c5cff;
  --gold: #ffcc40;
  --cash: #72ff8c;
  --display: "Fredoka", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-weight: 700; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: fixed; z-index: 10; left: 0; right: 0; top: 0; pointer-events: none;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.chip { pointer-events: auto; background: rgba(10,5,28,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 7px 12px; display: flex; align-items: center; gap: 6px; }
.money { font-family: var(--display); font-size: 21px; color: var(--cash); font-variant-numeric: tabular-nums; min-width: 92px; }
.money.bump { animation: bump .25s; }
@keyframes bump { 50% { transform: scale(1.12) } }
.lvl { flex-direction: column; align-items: stretch; gap: 4px; border-radius: 16px; padding: 6px 12px; min-width: 0; }
.lvl .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; white-space: nowrap; }
.lvl .top b { font-family: var(--display); font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.lvl .top span { color: var(--pink); }
.bar { height: 7px; border-radius: 7px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--violet)); border-radius: 7px; transition: width .3s; }
.card-btn { width: 46px; height: 46px; justify-content: center; padding: 0; font-size: 22px; position: relative; }
.card-btn small { position: absolute; bottom: -4px; right: -4px; background: var(--violet); border-radius: 9px; font-size: 10px; padding: 1px 6px; font-family: var(--display); }

.hint { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); width: max-content; text-align: center; pointer-events: none;
  background: rgba(10,5,28,.85); border: 1.5px solid var(--gold); border-radius: 999px; padding: 10px 18px; font-size: 15px; }
.viral { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0px));
  background: linear-gradient(135deg, var(--gold), #ff8a1f); color: #1a0d00; border-radius: 999px; padding: 6px 14px; font-family: var(--display); font-size: 15px; pointer-events: none; }

.toast { position: fixed; z-index: 60; left: 50%; top: calc(118px + env(safe-area-inset-top,0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
  padding: 9px 16px; border-radius: 999px; background: rgba(8,4,20,.92); border: 1.5px solid var(--pink); font-size: 14px; text-align: center; pointer-events: none; animation: drop .3s cubic-bezier(.3,1.5,.5,1); }
@keyframes drop { from { transform: translate(-50%,-24px); opacity: 0 } }

.layer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  padding: calc(20px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px));
  background: rgba(4,2,14,.78); }
.modal { width: min(400px,100%); max-height: 100%; overflow-y: auto; border-radius: 28px; padding: 24px 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center;
  border: 2px solid transparent; background: linear-gradient(#1b0e3a,#1b0e3a) padding-box, linear-gradient(135deg,var(--pink),var(--violet),var(--gold)) border-box;
  animation: popin .35s cubic-bezier(.3,1.5,.5,1); }
@keyframes popin { from { transform: scale(.8); opacity: 0 } }
.modal .em { font-size: 72px; line-height: 1; }
.modal h2 { margin: 0; font-family: var(--display); font-size: 27px; text-wrap: balance; }
.modal p { margin: 0; font-size: 15px; color: var(--ink-dim); text-wrap: balance; }
.grad { background: linear-gradient(90deg,var(--pink),var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.modal input { width: 100%; padding: 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06); color: var(--ink); font: 700 22px var(--display); text-align: center; -webkit-user-select: text; user-select: text; }
.logos { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; width: 100%; }
.logos button { aspect-ratio: 1; border-radius: 50%; font-size: 26px; background: rgba(255,255,255,.07); }
.logos button.on { background: linear-gradient(135deg,var(--pink),var(--violet)); }
.btn { width: 100%; padding: 14px; border-radius: 999px; font-family: var(--display); font-size: 18px; transition: transform .12s; }
.btn:active { transform: scale(.94); }
.brand { background: linear-gradient(90deg,var(--pink),var(--violet)); }
.goldbg { background: linear-gradient(135deg,var(--gold),#ff8a1f); color: #1a0d00; }
.ghost { background: rgba(255,255,255,.09); }
.row2 { display: flex; gap: 8px; width: 100%; }
.row2 .btn { flex: 1; font-size: 16px; }
.share-img { width: min(230px,66vw); border-radius: 18px; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
.stats { width: 100%; display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
.stats div { background: rgba(255,255,255,.06); border-radius: 14px; padding: 8px 4px; }
.stats b { display: block; font-family: var(--display); font-size: 17px; }
.stats small { font-size: 11px; color: var(--ink-dim); }
.confetti { position: fixed; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; }
.confetti span { position: absolute; top: -40px; font-size: 26px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
</style>

<canvas id="game" aria-label="Your office. Drag anywhere to walk."></canvas>
<div class="hud">
  <div class="chip money" id="money">$0</div>
  <div class="chip lvl"><div class="top"><b id="office">Garage</b><span id="round">→ Pre-Seed</span></div><div class="bar"><i id="prog"></i></div></div>
  <button class="chip card-btn" data-act="card" aria-label="Founder Card">✨<small id="flv">1</small></button>
</div>
<div class="viral" id="viral" hidden>🦄 VIRAL! 2x prices <span id="viralT"></span></div>
<div class="hint" id="hint" hidden></div>

<script>
// ---------- Content ----------
const T = 48, WW = 8*T;
const PRODUCTS = [
  { e:"☕️", n:"Coffee",  m:"Coffee Bar",    base:4,  col:"#7a4a2a" },
  { e:"📱", n:"App",     m:"Code Desk",     base:9,  col:"#2f5bd8" },
  { e:"🎨", n:"Design",  m:"Design Studio", base:18, col:"#c2399b" },
  { e:"📣", n:"Ad",      m:"Growth Lab",    base:32, col:"#d8662f" },
  { e:"🤖", n:"AI Model",m:"AI Lab",        base:55, col:"#2fa58d" },
  { e:"🚀", n:"Rocket",  m:"Launch Pad",    base:90, col:"#5b3fd8" },
];
const OFFICES = [
  { name:"Garage",          round:"Pre-Seed",  floor:"#3a2a52", tile:"#40305a" },
  { name:"Coworking Desk",  round:"Seed",      floor:"#2a3550", tile:"#303c58" },
  { name:"Startup Loft",    round:"Series A",  floor:"#43304a", tile:"#4a3552" },
  { name:"Office Tower",    round:"Series B",  floor:"#253f45", tile:"#2b474d" },
  { name:"Tech Campus",     round:"IPO",       floor:"#3c2e5e", tile:"#443468" },
  { name:"Mars HQ",         round:"Galactic",  floor:"#5a2f2a", tile:"#643631" },
];
const TITLES = [[1,"Wantrepreneur"],[3,"Side Hustler"],[6,"Builder"],[10,"Operator"],[15,"Rainmaker"],[20,"Visionary"],[30,"Titan"],[40,"Legend"],[50,"GOAT"]];
const FACES = ["🙂","😀","🤓","😊","🧐","😃","🥸","😺"];
const SKIN = ["#f6c89f","#e0a77a","#b97a4e","#8a5634","#ffd9b8","#c98d63"];
const SHIRT = ["#4da3ff","#ff6b6b","#ffd166","#06d6a0","#b388ff","#ff9f43","#48dbfb"];

// ---------- Save ----------
const SAVE_KEY = "unicornrush.walk.v1";
const fresh = () => ({ name:"", logo:"🦄", onboarded:false, L:0, cash:0, built:[], xp:0, lvl:1, life:0, sold:0, raised:0, unicorns:0, moved:false });
function load(){ try { const r = localStorage.getItem(SAVE_KEY); if (r) return Object.assign(fresh(), JSON.parse(r)); } catch(e){} return null; }
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }
let S = load() || fresh();

// ---------- Helpers ----------
const SUF = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
function num(v){
  if (v < 999.5) return Math.round(v).toString();
  let t = Math.min(Math.floor(Math.log10(v)/3), SUF.length-1), s = v/Math.pow(1000,t);
  if (s >= 999.5 && t < SUF.length-1) { t++; s /= 1000; }
  return (s>=100 ? s.toFixed(0) : s>=10 ? s.toFixed(1) : s.toFixed(2)) + SUF[t];
}
const money = v => "$"+num(v);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const dist = (a,b,x,y) => Math.hypot(a-x, b-y);
const office = L => OFFICES[Math.min(L, OFFICES.length-1)];
const officeName = L => office(L).name + (L >= OFFICES.length ? ` ${L-OFFICES.length+2}` : "");
const roundName = L => L < OFFICES.length ? office(L).round : `Galactic ${L-OFFICES.length+2}`;
const xpNeed = l => 30*Math.pow(l,1.5);
const title = () => { let t="Founder"; for (const [l,n] of TITLES) if (S.lvl>=l) t=n; return t; };

// ---------- Level (office) layout ----------
let W; // world state for current office
function buildLevel(){
  const L = S.L, k = Math.min(L+2, PRODUCTS.length);
  const price = i => Math.round(PRODUCTS[i].base*Math.pow(1.8, L));
  const lanes = [];
  for (let i=0;i<k;i++) {
    const y = (1.7 + 3*i)*T;
    lanes.push({ i, p:PRODUCTS[i], price:price(i), y, mx:1.25*T, cx:4.35*T,
      open:false, mStack:0, mTimer:0, cStack:0, cash:0, queue:[], workers:[] });
  }
  const seq = [{type:"hire",lane:0}];
  const UP = ["carry","speed","carry","speed","carry"];
  for (let i=1;i<k;i++) seq.push({type:"lane",lane:i},{type:UP[i-1],lane:i},{type:"hire",lane:i});
  seq.push({type:"market",lane:k-1},{type:"raise",lane:k-1});
  const y0 = (3*k + 1.15)*T, H = (3*k + 3.3)*T;
  const slots = [1.35*T, 3.35*T, 5.35*T]; let b = 0;
  const MULT = {hire:22, lane:28, carry:18, speed:18, market:30, raise:55};
  seq.forEach((s,idx)=>{
    s.id = `${s.type}${idx}`; s.paid = 0;
    const ln = lanes[s.lane];
    s.cost = Math.round(MULT[s.type]*ln.price);
    if (s.type==="lane") { s.x = 2.8*T; s.y = ln.y; s.w = 3.9*T; s.h = 1.25*T; s.label = `${ln.p.e} ${ln.p.m}`; }
    else if (s.type==="hire") { s.x = 2.8*T; s.y = ln.y + 1.3*T; s.w = 1.6*T; s.h = .85*T; s.label = `🧑‍🎓 Intern`; }
    else {
      s.x = slots[b++ % 3]; s.y = y0; s.w = 1.75*T; s.h = 1.1*T;
      s.label = { carry:"🎒 Bigger bag", speed:"👟 Sneakers", market:"📣 Billboard", raise:`🎤 Raise ${roundName(L)}` }[s.type];
    }
    if (S.built.includes(s.id)) s.done = true;
  });
  lanes[0].open = true;
  seq.forEach(s=>{ if (s.done && s.type==="lane") lanes[s.lane].open = true; });
  W = { L, k, lanes, seq, H, y0, door:{x:7.35*T, y:H-6}, customers:[], floats:[], flyers:[], spawnT:2, unicorn:null, nextUni:performance.now()+40000, viralUntil:0 };
  seq.forEach(s=>{ if (s.done && s.type==="hire") addWorker(lanes[s.lane]); });
  P.x = 6.1*T; P.y = Math.min(lanes[0].y + 1.5*T, W.H - T); P.stack = [];
}
const count = type => W.seq.filter(s=>s.done && s.type===type).length;
const carryCap = () => 4 + 3*count("carry");
const speed = () => 210*(1 + 0.18*count("speed"));
const visibleSpots = () => W.seq.filter(s=>!s.done).slice(0,2);
function addWorker(lane){ lane.workers.push({ x:lane.mx+.9*T, y:lane.y+.6*T, stack:0, state:"toM", t:0, shirt:pick(SHIRT), skin:pick(SKIN) }); }

// ---------- Player & input ----------
const P = { x:0, y:0, stack:[], t:0, face:"😎", bob:0, dir:1 };
const joy = { on:false, ox:0, oy:0, dx:0, dy:0, id:null };
const keys = {};
const cv = $("game"), g = cv.getContext("2d");
cv.addEventListener("pointerdown", e=>{ if (joy.on) return; joy.on=true; joy.id=e.pointerId; joy.ox=e.clientX; joy.oy=e.clientY; joy.dx=joy.dy=0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e=>{ if (!joy.on || e.pointerId!==joy.id) return; joy.dx=e.clientX-joy.ox; joy.dy=e.clientY-joy.oy; });
const endJoy = e=>{ if (e.pointerId===joy.id) { joy.on=false; joy.dx=joy.dy=0; } };
cv.addEventListener("pointerup", endJoy); cv.addEventListener("pointercancel", endJoy);
addEventListener("keydown", e=>{ keys[e.key.toLowerCase()] = true; });
addEventListener("keyup", e=>{ keys[e.key.toLowerCase()] = false; });

// ---------- Economy actions ----------
function gain(v){ S.cash += v; S.life += v; const m=$("money"); m.classList.remove("bump"); void m.offsetWidth; m.classList.add("bump"); }
function addXP(a){ S.xp += a; while (S.xp >= xpNeed(S.lvl)) { S.xp -= xpNeed(S.lvl); S.lvl++; toast(`⬆️ Founder Level ${S.lvl}: ${title()}`); } }
function floatText(x,y,text,color){ W.floats.push({x,y,text,color,t:0}); }
function completeSpot(s){
  s.done = true; S.built.push(s.id); addXP(10);
  const ln = W.lanes[s.lane];
  if (s.type==="lane") { ln.open = true; toast(`${ln.p.e} ${ln.p.m} is open! Customers want ${ln.p.n}s`); }
  else if (s.type==="hire") { addWorker(ln); toast(`🧑‍🎓 An intern now restocks the ${ln.p.m}`); }
  else if (s.type==="carry") toast(`🎒 You can carry ${carryCap()} now`);
  else if (s.type==="speed") toast("👟 You walk faster");
  else if (s.type==="market") toast("📣 More customers are coming");
  else if (s.type==="raise") { S.raised++; save(); confetti(); queue({type:"raise"}); return; }
  confettiSmall(s.x, s.y);
  save();
}

// ---------- Simulation ----------
function update(dt, now){
  // Player movement
  let mx = 0, my = 0;
  if (joy.on) { const d = Math.hypot(joy.dx, joy.dy); if (d > 6) { const m = Math.min(d, 60)/60; mx = joy.dx/d*m; my = joy.dy/d*m; } }
  if (keys.w||keys.arrowup) my -= 1; if (keys.s||keys.arrowdown) my += 1; if (keys.a||keys.arrowleft) mx -= 1; if (keys.d||keys.arrowright) mx += 1;
  const ml = Math.hypot(mx,my); if (ml > 1) { mx/=ml; my/=ml; }
  if (ml > 0.05) { P.x += mx*speed()*dt; P.y += my*speed()*dt; P.bob += dt*14; if (Math.abs(mx) > .1) P.dir = Math.sign(mx); if (!S.moved) { S.moved = true; } }
  P.x = Math.max(.45*T, Math.min(WW-.45*T, P.x)); P.y = Math.max(.7*T, Math.min(W.H-.45*T, P.y));
  P.t += dt;

  const viral = now < W.viralUntil;
  for (const ln of W.lanes) {
    if (!ln.open) continue;
    // Machine produces stock
    if (ln.mStack < 8) { ln.mTimer += dt; if (ln.mTimer >= 1.5) { ln.mTimer = 0; ln.mStack++; } } else ln.mTimer = 0;
    // Player picks up from machine tray
    if (dist(P.x,P.y, ln.mx+.95*T, ln.y) < .8*T && ln.mStack > 0 && P.stack.length < carryCap() && P.t > .09) { ln.mStack--; P.stack.push(ln.i); P.t = 0; }
    // Player drops matching items on the counter
    if (dist(P.x,P.y, ln.cx-.95*T, ln.y) < .8*T && ln.cStack < 24 && P.t > .07) {
      const k = P.stack.lastIndexOf(ln.i); if (k >= 0) { P.stack.splice(k,1); ln.cStack++; P.t = 0; }
    }
    // Player collects cash
    if (ln.cash > 0 && dist(P.x,P.y, ln.cx, ln.y+1.15*T) < .85*T) {
      const n = Math.min(10, Math.ceil(ln.cash / (ln.price*2)));
      for (let j=0;j<n;j++) W.flyers.push({ x:ln.cx+rnd(-10,10), y:ln.y+1.15*T+rnd(-8,8), t:-j*0.03 });
      gain(ln.cash); ln.cash = 0;
    }
    // Interns restock
    for (const w of ln.workers) {
      const tx = w.state==="toM" ? ln.mx+.95*T : ln.cx-.95*T, ty = ln.y + .35*T;
      const d = dist(w.x,w.y,tx,ty);
      if (d > 4) { const sp = 95*dt; w.x += (tx-w.x)/d*Math.min(sp,d); w.y += (ty-w.y)/d*Math.min(sp,d); w.walk = (w.walk||0)+dt*12; }
      else {
        w.t += dt;
        if (w.state==="toM") { if (ln.mStack > 0 && w.stack < 3 && w.t > .35) { ln.mStack--; w.stack++; w.t = 0; } if (w.stack >= 3 || (w.stack>0 && w.t > 1.5)) { w.state = "toC"; w.t = 0; } }
        else { if (w.stack > 0 && ln.cStack < 24 && w.t > .25) { w.stack--; ln.cStack++; w.t = 0; } if (w.stack === 0) { w.state = "toM"; w.t = 0; } }
      }
    }
    // Front customer buys from the counter
    ln.queue.forEach((c,j)=>{ c.slot = { x: ln.cx + 1.15*T + j*.85*T, y: ln.y }; });
    const c = ln.queue[0];
    if (c && c.state==="queue" && dist(c.x,c.y,c.slot.x,c.slot.y) < 3) {
      c.t += dt;
      if (ln.cStack > 0 && c.got < c.want && c.t > .22) { ln.cStack--; c.got++; c.t = 0; }
      if (c.got >= c.want) {
        const pay = c.want*ln.price*(viral?2:1);
        ln.cash += pay; S.sold += c.want; addXP(c.want);
        floatText(c.x, c.y-30, "+"+money(pay), "#72ff8c");
        c.state = "out"; c.face = pick(["😍","🤩","😄","🥳"]); c.path = [{x:W.door.x, y:ln.y}, {x:W.door.x, y:W.door.y}];
        ln.queue.shift();
      }
    }
  }
  // Spawn customers
  const open = W.lanes.filter(l=>l.open);
  W.spawnT -= dt;
  if (W.spawnT <= 0) {
    const room = open.filter(l=>l.queue.length < 3);
    if (room.length) {
      const ln = pick(room), maxWant = Math.min(1 + Math.floor(W.L/2) + 1, 4);
      const cst = { x:W.door.x, y:W.door.y, state:"in", want: 1+Math.floor(Math.random()*maxWant), got:0, t:0,
        face:pick(FACES), shirt:pick(SHIRT), skin:pick(SKIN), walk:0 };
      cst.path = [{x:W.door.x, y:ln.y}]; cst.lane = ln; ln.queue.push(cst); W.customers.push(cst);
    }
    W.spawnT = 3.2 / (1 + .35*(open.length-1)) * (count("market") ? .65 : 1) * rnd(.7,1.3);
  }
  // Move customers
  for (const c of W.customers) {
    let target = c.path.length ? c.path[0] : (c.state!=="out" ? c.slot : null);
    if (!target) continue;
    const d = dist(c.x,c.y,target.x,target.y), sp = (c.state==="out" ? 120 : 105)*dt;
    if (d > 2) { c.x += (target.x-c.x)/d*Math.min(sp,d); c.y += (target.y-c.y)/d*Math.min(sp,d); c.walk += dt*12; }
    else if (c.path.length) { c.path.shift(); if (c.state==="in" && !c.path.length) c.state = "queue"; }
  }
  W.customers = W.customers.filter(c => !(c.state==="out" && !c.path.length));
  // Build spots drain cash while you stand on them
  for (const s of visibleSpots()) {
    if (Math.abs(P.x-s.x) < s.w/2 && Math.abs(P.y-s.y) < s.h/2 && S.cash > 0) {
      const pay = Math.min(S.cash, s.cost - s.paid, Math.max(s.cost*.9, 40)*dt);
      S.cash -= pay; s.paid += pay;
      if (Math.random() < .5) W.flyers.push({ x:P.x, y:P.y-20, t:0, to:s });
      if (s.paid >= s.cost - 0.01) completeSpot(s);
    }
  }
  // Golden unicorn pickup
  if (!W.unicorn && now > W.nextUni) W.unicorn = { x:rnd(1,7)*T, y:rnd(1.5, W.H/T-1)*T, until:now+12000 };
  if (W.unicorn) {
    if (now > W.unicorn.until) { W.unicorn = null; W.nextUni = now + rnd(45000, 80000); }
    else if (dist(P.x,P.y,W.unicorn.x,W.unicorn.y) < .7*T) { W.unicorn = null; W.nextUni = now + rnd(45000,80000); W.viralUntil = now + 20000; S.unicorns++; addXP(15); toast("🦄 You went VIRAL! Everything sells for 2x"); confettiSmall(P.x,P.y); }
  }

  W.floats.forEach(f=>f.t+=dt); W.floats = W.floats.filter(f=>f.t<1);
  W.flyers.forEach(f=>f.t+=dt*3); W.flyers = W.flyers.filter(f=>f.t<1);
}

// ---------- Rendering ----------
let dpr = 1, cw = 0, ch = 0, scale = 1, camY = 0, camX = 0;
function resize(){ dpr = Math.min(devicePixelRatio||1, 2.5); cw = innerWidth; ch = innerHeight; cv.width = cw*dpr; cv.height = ch*dpr; scale = Math.min(cw/(WW+20), 1.7); }
addEventListener("resize", resize);
function rr(x,y,w,h,r){ g.beginPath(); g.roundRect(x,y,w,h,r); }
function emoji(e, x, y, size){ g.font = `${size}px system-ui, "Apple Color Emoji", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(e, x, y); }
function text(t, x, y, size, color, weight=700){ g.font = `${weight} ${size}px Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = color; g.fillText(t, x, y); }
function person(x, y, shirt, skin, face, walk, r=15){
  const b = Math.sin(walk||0)*2;
  g.fillStyle = "rgba(0,0,0,.28)"; g.beginPath(); g.ellipse(x, y+r*.9, r*.95, r*.38, 0, 0, 7); g.fill();
  g.fillStyle = shirt; rr(x-r*.8, y-r*.35+b*.3, r*1.6, r*1.25, r*.55); g.fill();
  g.fillStyle = skin; g.beginPath(); g.arc(x, y-r*.75+b*.5, r*.72, 0, 7); g.fill();
  emoji(face, x, y-r*.72+b*.5, r*1.25);
}
function itemStack(list, x, y, size){ list.forEach((it,k)=>emoji(PRODUCTS[it].e, x + (k%2?2:-2), y - k*size*.55, size)); }

function draw(now){
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle = "#12082a"; g.fillRect(0,0,cw,ch);
  const worldH = W.H*scale, topPad = 70, botPad = 70;
  camX = (cw - WW*scale)/2;
  const target = P.y*scale - ch*.55;
  const minC = -topPad - Math.max(0,(ch - topPad - botPad - worldH)/2), maxC = Math.max(minC, worldH - ch + botPad);
  camY += (Math.max(minC, Math.min(maxC, target)) - camY) * .15;
  g.setTransform(dpr*scale,0,0,dpr*scale, dpr*camX, -dpr*camY);
  const of = office(W.L);
  // Floor & walls
  g.fillStyle = "#0b0620"; rr(-10,-14,WW+20,W.H+24,22); g.fill();
  g.fillStyle = of.floor; rr(0,0,WW,W.H,16); g.fill();
  g.fillStyle = of.tile; for (let y=0;y<W.H;y+=T) for (let x=(y/T)%2?T:0;x<WW;x+=2*T) g.fillRect(x,y,T,Math.min(T,W.H-y));
  g.fillStyle = "rgba(255,255,255,.07)"; g.fillRect(0,0,WW,10);
  // Door
  g.fillStyle = "#ffcc40"; rr(W.door.x-.6*T, W.H-8, 1.2*T, 10, 4); g.fill(); text("ENTRANCE", W.door.x, W.H-18, 9, "rgba(255,204,64,.7)");
  // Lanes
  for (const ln of W.lanes) {
    if (!ln.open) continue;
    // machine
    g.fillStyle = "rgba(0,0,0,.25)"; rr(ln.mx-.78*T, ln.y-.5*T+6, 1.56*T, 1.1*T, 12); g.fill();
    g.fillStyle = ln.p.col; rr(ln.mx-.78*T, ln.y-.55*T, 1.56*T, 1.1*T, 12); g.fill();
    g.fillStyle = "rgba(255,255,255,.12)"; rr(ln.mx-.78*T, ln.y-.55*T, 1.56*T, .3*T, 12); g.fill();
    g.fillStyle = "rgba(255,255,255,.85)"; g.beginPath(); g.arc(ln.mx-.1*T, ln.y-.02*T, 19, 0, 7); g.fill();
    emoji(ln.p.e, ln.mx-.1*T, ln.y-.02*T, 26);
    g.fillStyle = "rgba(0,0,0,.35)"; rr(ln.mx-.6*T, ln.y+.36*T, 1.1*T, 5, 3); g.fill();
    g.fillStyle = "#4df2b2"; rr(ln.mx-.6*T, ln.y+.36*T, 1.1*T*(ln.mStack>=8?1:ln.mTimer/1.5), 5, 3); g.fill();
    // tray
    g.fillStyle = "rgba(255,255,255,.18)"; rr(ln.mx+.6*T, ln.y-.15*T, .7*T, .55*T, 8); g.fill();
    itemStack(Array(ln.mStack).fill(ln.i), ln.mx+.95*T, ln.y+.05*T, 17);
    // counter
    g.fillStyle = "rgba(0,0,0,.25)"; rr(ln.cx-.7*T, ln.y-.42*T+6, 1.4*T, .9*T, 10); g.fill();
    g.fillStyle = "#e9e2ff"; rr(ln.cx-.7*T, ln.y-.45*T, 1.4*T, .9*T, 10); g.fill();
    g.fillStyle = ln.p.col; rr(ln.cx-.7*T, ln.y+.3*T, 1.4*T, .15*T, 4); g.fill();
    itemStack(Array(Math.min(ln.cStack,12)).fill(ln.i), ln.cx-.25*T, ln.y+.08*T, 17);
    if (ln.cStack > 12) text(`×${ln.cStack}`, ln.cx+.35*T, ln.y, 12, "#2a1650");
    else if (ln.cStack === 0) text("EMPTY", ln.cx+.25*T, ln.y, 10, "rgba(42,22,80,.5)");
    // drop/pick zones (subtle rings)
    g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = 2; g.setLineDash([5,5]);
    g.beginPath(); g.arc(ln.mx+.95*T, ln.y+.55*T, .42*T, 0, 7); g.stroke();
    g.beginPath(); g.arc(ln.cx-.95*T, ln.y+.55*T, .42*T, 0, 7); g.stroke(); g.setLineDash([]);
    // cash pile
    if (ln.cash > 0) {
      const n = Math.min(14, Math.ceil(ln.cash/(ln.price*2)));
      for (let j=0;j<n;j++) { const bx = ln.cx + ((j%3)-1)*14, by = ln.y+1.2*T - Math.floor(j/3)*5;
        g.fillStyle = "#1f8f3a"; rr(bx-11, by-6, 22, 12, 3); g.fill(); g.fillStyle = "#72ff8c"; rr(bx-9, by-4, 18, 8, 2); g.fill(); }
      text(money(ln.cash), ln.cx, ln.y+1.2*T - Math.ceil(n/3)*5 - 14, 12, "#72ff8c");
    }
  }
  // Build spots
  const vis = visibleSpots(), pulse = (Math.sin(now/250)+1)/2;
  for (const s of vis) {
    const afford = S.cash > 0;
    g.fillStyle = "rgba(255,255,255,.06)"; rr(s.x-s.w/2, s.y-s.h/2, s.w, s.h, 12); g.fill();
    if (s.paid > 0) { g.fillStyle = "rgba(250,87,229,.45)"; rr(s.x-s.w/2, s.y-s.h/2, s.w*(s.paid/s.cost), s.h, 12); g.fill(); }
    g.strokeStyle = s.type==="raise" ? "#ffcc40" : `rgba(255,255,255,${.5+.4*pulse})`; g.lineWidth = 3; g.setLineDash([9,6]);
    rr(s.x-s.w/2, s.y-s.h/2, s.w, s.h, 12); g.stroke(); g.setLineDash([]);
    text(s.label, s.x, s.y - (s.h>T ? 10 : 7), s.w > 2*T ? 15 : 12, "#fff");
    text(money(Math.max(0, s.cost - s.paid)), s.x, s.y + (s.h>T ? 12 : 9), s.w > 2*T ? 15 : 12, afford ? "#ffcc40" : "rgba(255,204,64,.6)");
  }
  // Guidance arrow over the next spot
  const next = vis[0];
  if (next && S.cash >= Math.min(next.cost - next.paid, 1)) {
    const ay = next.y - next.h/2 - 18 - pulse*8;
    g.fillStyle = "#ffcc40"; g.beginPath(); g.moveTo(next.x-11, ay-12); g.lineTo(next.x+11, ay-12); g.lineTo(next.x, ay+2); g.fill();
  }
  // Unicorn
  if (W.unicorn) { const u = W.unicorn; g.shadowColor = "#ffcc40"; g.shadowBlur = 18; emoji("🦄", u.x, u.y - 6 - pulse*6, 34); g.shadowBlur = 0; }
  // Characters sorted by depth
  const actors = [];
  W.customers.forEach(c=>actors.push({y:c.y, f:()=>{
    person(c.x, c.y, c.shirt, c.skin, c.face, c.walk);
    if (c.state!=="out") { const left = c.want - c.got;
      g.fillStyle = "#fff"; rr(c.x-19, c.y-58, 38, 22, 11); g.fill();
      g.beginPath(); g.moveTo(c.x-4,c.y-37); g.lineTo(c.x+4,c.y-37); g.lineTo(c.x,c.y-31); g.fill();
      emoji(c.lane.p.e, c.x-6, c.y-47, 13); text(`×${left}`, c.x+10, c.y-47, 11, "#2a1650"); }
    else { g.fillStyle = "rgba(255,255,255,.9)"; emoji(c.lane.p.e, c.x+14, c.y-4, 13); }
  }}));
  W.lanes.forEach(ln=>ln.workers.forEach(w=>actors.push({y:w.y, f:()=>{ person(w.x, w.y, w.shirt, w.skin, "🧑‍🎓", w.walk, 13); itemStack(Array(w.stack).fill(ln.i), w.x, w.y-34, 14); }})));
  actors.push({y:P.y, f:()=>{
    g.fillStyle = "rgba(250,87,229,.25)"; g.beginPath(); g.ellipse(P.x, P.y+16, 22, 9, 0, 0, 7); g.fill();
    person(P.x, P.y, "#fa57e5", "#ffd9b8", P.face, P.bob, 18);
    emoji(S.logo, P.x + 12*P.dir, P.y - 34, 13);
    if (P.stack.length) { itemStack(P.stack, P.x, P.y-48, 19); if (P.stack.length >= carryCap()) text("MAX", P.x, P.y-56-P.stack.length*10.5, 11, "#ffcc40"); }
  }});
  actors.sort((a,b)=>a.y-b.y).forEach(a=>a.f());
  // Floating texts and flying cash
  for (const f of W.floats) { g.globalAlpha = 1-f.t; text(f.text, f.x, f.y - f.t*30, 15, f.color); }
  g.globalAlpha = 1;
  for (const f of W.flyers) {
    if (f.t < 0) continue; const tx = f.to ? f.to.x : P.x, ty = f.to ? f.to.y : P.y-20, k = f.t*f.t;

    const a = Math.atan2(next.y-P.y, next.x-P.x), r = 42;

  }

  g.setTransform(dpr,0,0,dpr,0,0);
  if (joy.on) {
    const d = Math.min(Math.hypot(joy.dx,joy.dy), 50), a = Math.atan2(joy.dy, joy.dx);
    g.fillStyle = "rgba(255,255,255,.12)"; g.beginPath(); g.arc(joy.ox, joy.oy, 52, 0, 7); g.fill();
    g.strokeStyle = "rgba(255,255,255,.3)"; g.lineWidth = 2; g.stroke();
    g.fillStyle = "rgba(255,255,255,.55)"; g.beginPath(); g.arc(joy.ox + Math.cos(a)*d, joy.oy + Math.sin(a)*d, 24, 0, 7); g.fill();
  }
}

// ---------- HUD ----------
let hudSig = "";
function hud(now){
  $("money").textContent = money(S.cash);
  const done = W.seq.filter(s=>s.done).length;
  const sig = `${W.L}|${done}|${S.lvl}`;
  if (sig !== hudSig) { hudSig = sig; $("office").textContent = officeName(W.L); $("round").textContent = `→ ${roundName(W.L)}`; $("prog").style.width = (done/W.seq.length*100)+"%"; $("flv").textContent = S.lvl; }
  const v = now < W.viralUntil; $("viral").hidden = !v; if (v) $("viralT").textContent = Math.ceil((W.viralUntil-now)/1000)+"s";
  // Coaching for the first office
  let h = "";
  const ln0 = W.lanes[0];
  if (!S.moved) h = "👆 Drag anywhere to walk";
  else if (S.sold < 4 && S.raised === 0) {
    if (!P.stack.length && ln0.cStack === 0) h = `Walk to the ${ln0.p.e} machine to grab coffee`;
    else if (P.stack.length) h = "Carry it to the counter for the customers";
    else h = "Grab more coffee from the machine";
  }
  else if (S.life < 40 && S.raised === 0 && W.lanes.some(l=>l.cash>0)) h = "Walk over the 💵 to collect your money";
  else if (S.built.length === 0 && S.raised === 0 && S.cash > 0) h = "Stand on the glowing spot to build";
  const el = $("hint"); el.hidden = !h; if (h && el.textContent !== h) el.textContent = h;
}

// ---------- Founder Card ----------
const tierOf = L => [["Bronze","🥉"],["Silver","🥈"],["Gold","🥇"],["Diamond","💎"],["Legend","👑"]][Math.min(4, Math.floor(L/2))];
const lastRound = () => S.raised === 0 ? "Bootstrapped" : roundName(S.raised-1);
function shareText(){ return `My startup ${S.name} ${S.logo} just raised its ${lastRound()} and moved into the ${officeName(S.L)}. ${num(S.sold)} customers served, ${money(S.life)} earned. Can you build a bigger one? #UnicornRush`; }
function cardURL(){
  const Wd=1080, Hd=1920, c=document.createElement("canvas"); c.width=Wd; c.height=Hd; const x=c.getContext("2d");
  const bg=x.createLinearGradient(0,0,Wd,Hd); bg.addColorStop(0,"#8c5cff"); bg.addColorStop(.55,"#fa57e5"); bg.addColorStop(1,"#ffcc40");
  x.fillStyle=bg; x.fillRect(0,0,Wd,Hd); x.fillStyle="rgba(0,0,0,.25)"; x.fillRect(0,0,Wd,Hd);
  x.textAlign="center"; x.fillStyle="#fff";
  const F=(s,w=700)=>`${w} ${s}px Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif`;
  const fit=(t,s,mw,y)=>{ do { x.font=F(s); s-=4; } while (x.measureText(t).width>mw && s>20); x.fillText(t,Wd/2,y); };
  const [tn,te]=tierOf(S.raised);
  x.globalAlpha=.85; x.font=F(40); x.fillText("U N I C O R N   R U S H", Wd/2, 140); x.globalAlpha=1;
  x.font="240px system-ui"; x.fillText(S.logo, Wd/2, 520);
  fit(S.name||"Stealth Startup", 100, Wd-140, 680);
  x.font=F(54,600); const rl=`🏢 ${officeName(S.L)}`, rw=x.measureText(rl).width+80;
  x.fillStyle="rgba(0,0,0,.3)"; x.beginPath(); x.roundRect((Wd-rw)/2,720,rw,90,45); x.fill(); x.fillStyle="#fff"; x.fillText(rl,Wd/2,785);
  x.globalAlpha=.85; x.font=F(40); x.fillText("J U S T   R A I S E D", Wd/2, 1010); x.globalAlpha=1;
  x.shadowColor="rgba(0,0,0,.3)"; x.shadowBlur=16; fit(lastRound(), 170, Wd-120, 1180); x.shadowBlur=0;
  x.font=F(56,600); x.fillText(`${te} ${tn} Founder`, Wd/2, 1290);
  [[`LV ${S.lvl}`, title()],[num(S.sold),"served"],[money(S.life),"earned"]].forEach(([a,b],k)=>{
    const cx=Wd/6+k*Wd/3; x.font=F(60); x.fillText(a,cx,1500); x.globalAlpha=.85; x.font=F(36,600); x.fillText(b,cx,1555); x.globalAlpha=1; });
  x.font=F(66); x.fillText("Can you beat me?", Wd/2, 1740); x.globalAlpha=.85; x.font=F(40,600); x.fillText("#UnicornRush", Wd/2, 1810); x.globalAlpha=1;
  return c.toDataURL("image/png");
}

// ---------- Modals & effects ----------
const Q = []; let modalOpen = false;
function queue(it){ Q.push(it); if (!modalOpen) showNext(); }
function showNext(){
  const it = Q.shift(); if (!it) { modalOpen = false; return; }
  modalOpen = true; joy.on = false; let body = "";
  if (it.type==="onboard") body = `<div class="em" id="obLogo">${S.logo}</div><h2>Every unicorn starts in a garage.</h2>
    <p>Name your startup. You'll run it yourself, from one coffee machine to Mars HQ.</p>
    <input id="obName" maxlength="24" placeholder="e.g. Pied Piper" autocomplete="off">
    <div class="logos">${["🦄","🚀","🔥","💎","🧠","⚡️","🐙","🍕","🌮","🛸","🐉","🌈"].map(l=>`<button class="${l===S.logo?"on":""}" data-act="logo" data-l="${l}">${l}</button>`).join("")}</div>
    <button class="btn brand" data-act="found">FOUND MY COMPANY</button>`;
  else if (it.type==="raise") body = `<div class="em">🎉</div><h2 class="grad">${roundName(S.L)} raised!</h2>
    <p>Investors are in. ${esc(S.name)} is moving out of the ${officeName(S.L)} and into the <b style="color:var(--ink)">${officeName(S.L+1)}</b>, with new products and bigger customers.</p>
    <button class="btn goldbg" data-act="share">Brag about it</button>
    <button class="btn brand" data-act="nextOffice">MOVE IN →</button>`;
  else if (it.type==="share") body = `<img class="share-img" alt="Your Founder Card" src="${cardURL()}">
    <h2 style="font-size:22px">Post it to your story</h2><p>Press and hold the card, then tap <b>Save to Photos</b>. Add the caption below.</p>
    <p id="capt" style="font-size:13px;color:var(--ink);-webkit-user-select:text;user-select:text">${esc(shareText())}</p>
    <div class="row2"><button class="btn brand" data-act="copy" id="copyBtn">Copy caption</button><button class="btn ghost" data-act="close">${it.after?"Continue":"Done"}</button></div>`;
  else if (it.type==="card") body = `<div class="em">${S.logo}</div><h2>${esc(S.name)}</h2><p>Level ${S.lvl} <b class="grad">${title()}</b> · ${officeName(S.L)}</p>
    <div class="stats"><div><b>${num(S.sold)}</b><small>served</small></div><div><b>${money(S.life)}</b><small>earned</small></div><div><b>${S.raised}</b><small>rounds raised</small></div></div>
    <button class="btn brand" data-act="share">Share my Founder Card</button><button class="btn ghost" data-act="close">Back to work</button>`;
  const L = document.createElement("div"); L.className = "layer"; L.id = "layer"; L.innerHTML = `<div class="modal">${body}</div>`;
  document.body.appendChild(L);
  if (it.after) L.dataset.after = it.after;
}
function closeModal(){ const l = $("layer"); const after = l?.dataset.after; l?.remove(); modalOpen = false; if (after === "raise") Q.unshift({type:"raise"}); setTimeout(showNext, 150); }
let toastT;
function toast(msg){ document.querySelector(".toast")?.remove(); clearTimeout(toastT); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); toastT=setTimeout(()=>t.remove(),2300); }
function confetti(){
  const C=document.createElement("div"); C.className="confetti"; const E=["🎉","✨","💸","🦄","⭐️","🚀"];
  C.innerHTML=Array.from({length:40},(_,k)=>`<span style="left:${Math.random()*100}%;--dx:${(Math.random()*120-60).toFixed(0)}px;--r:${(Math.random()*720-360).toFixed(0)}deg;animation-duration:${(1.6+Math.random()*1.4).toFixed(2)}s;animation-delay:${(Math.random()*.5).toFixed(2)}s">${E[k%E.length]}</span>`).join("");
  document.body.appendChild(C); setTimeout(()=>C.remove(),3600);
}
function confettiSmall(x,y){ for (let k=0;k<6;k++) W.floats.push({x:x+rnd(-30,30), y:y+rnd(-10,10), text:pick(["✨","⭐️","🎉"]), color:"#fff", t:rnd(0,.3)}); }

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a==="logo") { S.logo = t.dataset.l; $("obLogo").textContent = S.logo; document.querySelectorAll(".logos button").forEach(b=>b.classList.toggle("on", b===t)); }
  else if (a==="found") { const n = ($("obName").value||"").trim(); S.name = n ? n.slice(0,24) : "Stealth Startup"; S.onboarded = true; save(); closeModal(); }
  else if (a==="nextOffice") { S.L++; S.cash = 0; S.built = []; save(); buildLevel(); hudSig = ""; closeModal(); toast(`🏢 Welcome to the ${officeName(S.L)}!`); }
  else if (a==="share") { const l=$("layer"); const fromRaise = !!l?.querySelector('[data-act="nextOffice"]'); l?.remove(); modalOpen=false; Q.unshift({type:"share", after: fromRaise ? "raise" : undefined}); showNext(); }
  else if (a==="card") { if (!modalOpen) queue({type:"card"}); }
  else if (a==="close") closeModal();
  else if (a==="copy") {
    const btn = $("copyBtn"); const done = ok => { btn.textContent = ok ? "Copied ✓" : "Select the caption above"; if (!ok) { const r=document.createRange(); r.selectNodeContents($("capt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } };
    try { navigator.clipboard.writeText(shareText()).then(()=>done(true), ()=>done(false)); } catch(err) { done(false); }
  }
});
document.addEventListener("keydown", e=>{ if (e.key==="Enter" && document.activeElement===$("obName")) document.querySelector('[data-act="found"]').click(); });

// ---------- Loop ----------
let last = performance.now(), saveClock = 0;
function frame(now){
  const dt = Math.min((now-last)/1000, .1); last = now;
  if (S.onboarded && !modalOpen) { update(dt, now); saveClock += dt; if (saveClock > 3) { saveClock = 0; save(); } }
  draw(now); hud(now);
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", ()=>{ if (document.hidden) save(); last = performance.now(); });

function start(data){
  if (data && data.S) S = Object.assign(fresh(), data.S);
  resize(); buildLevel();
  camY = P.y*scale - ch*.55;
  if (!S.onboarded) queue({type:"onboard"});
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
