function num(v){

  if (s >= 999.5 && t < SUF.length-1) { t++; s /= 1000; }

const pulses = [];
function advance(dt){
  let got = 0;
  S.st.forEach((s,i)=>{
    if (s.n===0 || !(s.run||s.m)) return;
    const c = cycle(i), r = revCycle(i);
    if (s.m && c < 0.15) { got += r*dt/c; s.p = 1; return; }

  });

}

  g.shadowColor="rgba(0,0,0,.3)"; g.shadowBlur=16; fit(money(v), 190, W-120, 1190); g.shadowBlur=0;
  g.font=F(56,600); g.fillText(`${te} ${tn} Founder`, W/2, 1290);
  [[`LV ${S.lvl}`, title()],[`🔥 ${S.streak}`,"day streak"],[`⭐️ ${S.stars}`,`${S.exits} exits`]].forEach(([a,b],k)=>{
    const x = W/6 + k*W/3; g.font=F(60); g.fillText(a,x,1500); g.globalAlpha=.85; g.font=F(36,600); g.fillText(b,x,1555); g.globalAlpha=1;
  });
  g.font=F(66); g.fillText("Can you beat me?", W/2, 1740); g.globalAlpha=.85; g.font=F(40,600); g.fillText("#UnicornRush", W/2, 1810); g.globalAlpha=1;
  return c.toDataURL("image/png");
}

// ---------- Modals, pitch, toasts ----------
const Q = []; let modalOpen = false;
function queue(item){ Q.push(item); if (!modalOpen) showNext(); }
function showNext(){
  const it = Q.shift(); if (!it) { modalOpen=false; return; }
  modalOpen = true; let body;
  if (it.type==="reward") body = `<div class="em">${it.em}</div><h2>${it.h}</h2><p>${it.p}</p><div class="amt">${money(it.amt)}</div><p style="font-size:12px">${it.f}</p>
    <button class="pill goldbg big-btn press" data-act="close">COLLECT</button>`;
  else if (it.type==="round") body = `<div class="em">${it.r.emoji}</div><h2 class="title-big">${it.r.name} CLOSED!</h2>
    <p>${esc(S.name)} is now worth ${money(valuation())}. All revenue is permanently 2x.</p>
    ${it.r.id===IPO?`<p style="color:var(--gold)">🏝️ You can now EXIT from the Trophies tab.</p>`:""}
    <button class="pill brand big-btn press" data-act="share">Brag about it</button>
    <button class="pill off big-btn press" data-act="close" style="color:var(--ink)">LET'S GO</button>`;
  else if (it.type==="ach") body = `<div class="em">${it.a.emoji}</div><span class="eyebrow">Trophy unlocked</span><h2 style="color:var(--gold)">${it.a.title}</h2>
    <p>${it.a.detail} · +${it.a.xp} XP</p><button class="pill brand big-btn press" data-act="close">LET'S GO</button>`;
  else if (it.type==="exit") body = `<div class="em">🏝️</div><h2 style="color:var(--gold)">YOU EXITED!</h2>
    <p>+${it.g} Reputation stars. Your next company grows faster. Time to build something even bigger.</p><button class="pill brand big-btn press" data-act="close">LET'S GO</button>`;
  else if (it.type==="confirmExit") body = `<div class="em">🏝️</div><h2>Exit ${esc(S.name)}?</h2>
    <p>You'll start a new company from the garage, but keep your founder level, skills, trophies and every star (+2% revenue each, forever).</p>
    <div class="row2"><button class="pill off press" data-act="close" style="color:var(--ink)">Cancel</button><button class="pill goldbg press" data-act="doExit">Exit for ${starsOnExit()} ⭐️</button></div>`;
  else if (it.type==="share") body = `<img class="share-img" alt="Your Founder Card" src="${cardURL()}">
    <h2 style="font-size:22px">Post it to your story</h2><p>Press and hold the card, then tap <b>Save to Photos</b>. Add the caption below.</p>
    <p id="capt" style="font-size:13px;color:var(--ink);-webkit-user-select:text;user-select:text">${esc(shareText())}</p>
    <div class="row2"><button class="pill brand press" data-act="copy" id="copyBtn">Copy caption</button><button class="pill off press" data-act="close" style="color:var(--ink)">Done</button></div>`;
  else if (it.type==="onboard") body = `<div class="em" id="obLogo">${S.logo}</div><h2>Every unicorn starts in a garage.</h2>
    <p>Name your startup. You'll take it from a coffee machine to an IPO.</p>
    <input id="obName" maxlength="24" placeholder="e.g. Pied Piper" autocomplete="off">
    <div class="logos">${["🦄","🚀","🔥","💎","🧠","⚡️","🐙","🍕","🌮","🛸","🐉","🌈"].map(l=>`<button class="press ${l===S.logo?"on":""}" data-act="logo" data-l="${l}">${l}</button>`).join("")}</div>
    <button class="pill brand big-btn press" data-act="found">FOUND MY COMPANY</button>`;
  const L = document.createElement("div"); L.className="layer"; L.id="layer"; L.innerHTML = `<div class="modal">${body}</div>`;
  document.body.appendChild(L);
}
function closeModal(){ const l=$("layer"); if (l) l.remove(); modalOpen=false; setTimeout(showNext, 200); }

let pitch = null;
function openPitch(){
  const r = nextRound(); if (!r) return;
  pitch = {start: performance.now(), hits:0, miss:0, zone:0, done:false};
  const P = document.createElement("div"); P.className="pitch"; P.id="pitch";
  P.innerHTML = `<button class="leave" data-act="leave">‹ Leave</button>
    <h2 class="title-big">${r.emoji} ${r.name} PITCH</h2><div class="investor">🧐</div><div class="quote">${r.line}</div>
    <div class="dots"><i></i><i></i><i></i></div><small class="dim" id="pStr"></small>
    <div class="meter" id="meter"><div class="zone" id="zone"></div><div class="needle" id="needle"></div></div>
    <div class="feedback" id="pFb">Tap when the needle is in the green zone</div>
    <button class="goldbg go press" data-act="pitchTap">PITCH!</button>`;
  document.body.appendChild(P);
  pitch.zone = randZone(); placeZone(); pStrikes();
}
const randZone = () => { const h=zoneW()/2; return h + Math.random()*(1-2*h); };
function placeZone(){ const z=$("zone"); z.style.left=((pitch.zone-zoneW()/2)*100)+"%"; z.style.width=(zoneW()*100)+"%"; }
function pStrikes(){ $("pStr").textContent = `Strikes left: ${Math.max(0, missesAllowed()-pitch.miss)}`; }
const needlePos = () => (Math.sin((performance.now()-pitch.start)/1000*needleSpeed())+1)/2;
const HIT = ["🔥 Killer metric!","😮 They're leaning in...","🤝 Term sheet incoming!"], MISS = ["😬 Awkward silence...","🫠 “Who are your competitors?”","🥶 Someone checked their phone"];
function pitchTap(){
  if (!pitch || pitch.done) return;
  if (Math.abs(needlePos()-pitch.zone) <= zoneW()/2) {
    $("pFb").textContent = HIT[Math.min(pitch.hits,2)]; pitch.hits++;
    document.querySelectorAll(".dots i").forEach((d,k)=>d.classList.toggle("on", k<pitch.hits));
    if (pitch.hits>=3) endPitch(true); else { pitch.zone = randZone(); placeZone(); }
  } else {
    $("pFb").textContent = MISS[Math.min(pitch.miss,2)]; pitch.miss++; pStrikes();
    const m=$("meter"); m.classList.remove("shake"); void m.offsetWidth; m.classList.add("shake");
    if (pitch.miss > missesAllowed()) { $("pFb").textContent = "❌ They passed... for now."; endPitch(false); }
  }
}
function endPitch(ok){ pitch.done = true; setTimeout(()=>{ $("pitch")?.remove(); pitch=null; finishPitch(ok); }, 900); }

let toastT;
function toast(msg){
  document.querySelector(".toast")?.remove(); clearTimeout(toastT);
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  toastT = setTimeout(()=>t.remove(), 2300);
}
function confetti(){
  const C = document.createElement("div"); C.className="confetti";
  const E = ["🎉","✨","💸","🦄","⭐️","🚀"];
  C.innerHTML = Array.from({length:40},(_,k)=>`<span style="left:${Math.random()*100}%;--dx:${(Math.random()*120-60).toFixed(0)}px;--r:${(Math.random()*720-360).toFixed(0)}deg;animation-duration:${(1.6+Math.random()*1.4).toFixed(2)}s;animation-delay:${(Math.random()*.5).toFixed(2)}s">${E[k%E.length]}</span>`).join("");
  document.body.appendChild(C); setTimeout(()=>C.remove(), 3600);
}
function drawUnicorn(){
  let u = $("uni");
  if (!unicorn) { if (u) u.remove(); return; }
  if (!u) { u = document.createElement("button"); u.id="uni"; u.className="unicorn"; u.dataset.act="unicorn"; u.textContent="🦄"; u.setAttribute("aria-label","Catch the golden unicorn"); document.body.appendChild(u); }
  u.style.left = (unicorn.x*100)+"vw"; u.style.top = (unicorn.y*100)+"vh";
}

// ---------- Input ----------
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]"); if (!t) return;
  const i = +t.dataset.i, a = t.dataset.act;
  if (a==="tap") tapSt(i);
  else if (a==="buy") buy(i);
  else if (a==="hire") hire(i);
  else if (a==="mode") { buyMode = t.dataset.m; drawModes(); }
  else if (a==="pitch") openPitch();
  else if (a==="pitchTap") pitchTap();
  else if (a==="leave") { $("pitch")?.remove(); pitch=null; }
  else if (a==="unicorn") catchUnicorn();
  else if (a==="skill") upgrade(t.dataset.k);
  else if (a==="exit") queue({type:"confirmExit"});
  else if (a==="doExit") { closeModal(); exitCompany(); }
  else if (a==="share") { $("layer")?.remove(); Q.unshift({type:"share"}); showNext(); }
  else if (a==="copy") {
    const txt = shareText(), btn = $("copyBtn");
    const done = ok => { btn.textContent = ok ? "Copied ✓" : "Select the caption above"; if (!ok) { const r=document.createRange(); r.selectNodeContents($("capt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } };
    try { navigator.clipboard.writeText(txt).then(()=>done(true), ()=>done(false)); } catch(err) { done(false); }
  }
  else if (a==="close") closeModal();
  else if (a==="logo") { S.logo = t.dataset.l; $("obLogo").textContent = S.logo; document.querySelectorAll(".logos button").forEach(b=>b.classList.toggle("on", b===t)); }
  else if (a==="found") {
    const n = ($("obName").value||"").trim(); S.name = n ? n.slice(0,24) : "Stealth Startup"; S.onboarded = true;
    daily(true); nextUnicorn = Date.now()+45000; save(); closeModal();
  }
  else if (a==="tab") { tab = t.dataset.tab; showTab(); }
});
document.addEventListener("keydown", e=>{ if (e.key==="Enter" && $("obName") && document.activeElement===$("obName")) document.querySelector('[data-act="found"]').click(); });
function showTab(){
  ["office","founder","trophies","flex"].forEach(n=>{ $("tab-"+n).hidden = n!==tab; });
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  if (tab==="flex") flexSig=""; window.scrollTo(0,0); render();
}
function render(){
  if (tab==="office") drawOffice(); else if (tab==="founder") drawFounder(); else if (tab==="trophies") drawTrophies(); else drawFlex();
  $("tBadge").hidden = S.sp<=0; $("tBadge").textContent = S.sp;
  drawUnicorn();
}

// ---------- Loop ----------
let last = performance.now(), saveClock = 0, achClock = 0, slowClock = 0;
function frame(now){
  const dt = Math.min((now-last)/1000, 1); last = now;
  if (S.onboarded) {
    advance(dt);
    if (unicorn && Date.now()>unicorn.until) unicorn = null;
    if (!unicorn && Date.now()>nextUnicorn && !pitch) { unicorn = {x:.15+Math.random()*.7, y:.25+Math.random()*.5, until:Date.now()+8000}; nextUnicorn = Date.now()+60000+Math.random()*90000; }
    saveClock += dt; if (saveClock>5) { saveClock=0; save(); }
    achClock += dt; if (achClock>1) { achClock=0; checkAch(); }
  }
  slowClock += dt;
  if (tab==="office" || slowClock>0.5) { slowClock=0; render(); }
  if (pitch && !pitch.done) $("needle").style.left = (needlePos()*100)+"%";
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden) save(); else { last = performance.now(); offline(); daily(); }
});

function start(data){
  if (data && data.S) S = Object.assign(fresh(), data.S);
  if (S.st.length < ST.length) S.st = S.st.concat(freshStations().slice(S.st.length).map(x=>({...x,n:0})));
  drawModes(); render();
  if (!S.onboarded) queue({type:"onboard"}); else { offline(); daily(); }
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
